# rtw88 tuning for USB Wi-Fi dongles on the Zynq ci_hdrc USB host.
#
# disable_lps_deep: deep low-power-state is the least reliable part of rtw88
# over USB. When it wedges, every register access returns -110 (ETIMEDOUT) and
# the adapter drops off the control pipe entirely:
#
#   rtw_8822bu 1-1:1.0: write register 0x1c failed with -110
#   rtw_8822bu 1-1:1.0: rtw_usb_reg_sec: reg 0x4e0, usb write 1 fail, status: -110
#
# Costs a little idle power, buys a stable control pipe. Present on
# 6.12.0-redpitaya; harmless on builds without rtw88 loaded.
#
# NOTE: usbcore.autosuspend cannot be set from modprobe.d, because usbcore is
# built into the kernel rather than built as a module - it needs the kernel
# command line. rtw88_core is a real module, so this file does take effect.
options rtw88_core disable_lps_deep=y
