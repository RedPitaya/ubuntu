# See avahi-daemon.conf(5) for more information on this configuration
# file!

[server]
#host-name=foo
#domain-name=local
#browse-domains=0pointer.de, zeroconf.org
use-ipv4=yes
# The board has no routable IPv6. Everything avahi could answer over IPv6 is
# an fe80:: link-local address, which is of no use to a client: it has meaning
# only together with the scope of the interface it was learnt on, so a
# resolver that hands it to an application hands over an address that cannot
# be connected to.
use-ipv6=no
#allow-interfaces=eth0
#deny-interfaces=eth1
#check-response-ttl=no
#use-iff-running=no
#enable-dbus=yes
#disallow-other-stacks=no
#allow-point-to-point=no
#cache-entries-max=4096
#clients-max=4096
#objects-per-client-max=1024
#entries-per-entry-group-max=32
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=yes

[publish]
#disable-publishing=no
#disable-user-service-publishing=no
#add-service-cookie=no
#publish-addresses=yes
publish-hinfo=no
publish-workstation=no
#publish-domain=yes
#publish-dns-servers=192.168.50.1, 192.168.50.2
#publish-resolv-conf-dns-servers=yes
# This one is not implied by use-ipv6=no, and it is the one that bit: the
# default is yes, so avahi advertises the AAAA record inside replies sent over
# IPv4. A client asking over IPv4 therefore receives both A and AAAA, and
# glibc address selection can rank the IPv6 link-local first - which is why
# "ping <hostname>.local" answered fe80::32de:4bff:fe21:6e5d%wlan0 rather than
# the address the board actually serves on. Answer with A only.
publish-aaaa-on-ipv4=no
#publish-a-on-ipv6=no

[reflector]
#enable-reflector=no
#reflect-ipv=no
#reflect-filters=_airplay._tcp.local,_raop._tcp.local

[rlimits]
#rlimit-as=
#rlimit-core=0
#rlimit-data=8388608
#rlimit-fsize=0
#rlimit-nofile=768
#rlimit-stack=8388608
#rlimit-nproc=3
